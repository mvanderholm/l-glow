<!-- L. Glow — O glyph icon, 1024×1024, transparent background
     Proportions match LogoMark.js: sw=R*0.22, innerR=R*0.57, accentR=R*0.24, accentGap=R*0.14
     R=200 → circle Ø400 ≈ 39% of canvas; ~24% padding each side clears iOS rounded-rect mask
     Color: #9A5151 (rose accent / primary button color) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Circle outline + inner 4-pointed star, centered at (512, 574) -->
  <g transform="translate(512, 574)">

    <!-- Circle outline: R=200, sw=44, drawR=178 -->
    <circle cx="0" cy="0" r="178" fill="none" stroke="#9A5151" stroke-width="44"/>

    <!-- Inner 4-pointed star: outerR=114, r=34.2, q=24.2 -->
    <path d="M 0,-114 L 24.2,-24.2 L 114,0 L 24.2,24.2 L 0,114 L -24.2,24.2 L -114,0 L -24.2,-24.2 Z"
          fill="#9A5151"/>

  </g>

  <!-- Accent star: outerR=48, r=14.4, q=10.2 — centered at (512, 298) -->
  <g transform="translate(512, 298)">
    <path d="M 0,-48 L 10.2,-10.2 L 48,0 L 10.2,10.2 L 0,48 L -10.2,10.2 L -48,0 L -10.2,-10.2 Z"
          fill="#9A5151"/>
  </g>

</svg>
